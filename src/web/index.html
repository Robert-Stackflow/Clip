<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clip · 网页共享</title><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head><body><header><div><strong>Clip</strong><span>网页共享</span></div><select id="language" aria-label="界面语言"><option value="system">跟随浏览器</option><option value="zh-CN" data-no-translate>简体中文</option><option value="en">English</option></select><small id="connection">等待连接</small></header><main><section id="join" class="card"><h1>连接 Clip</h1><form id="connect-form"><label>浏览器名称<input id="name" maxlength="60" required placeholder="例如：我的手机"></label><label class="check"><input type="checkbox" id="verified" required>我已在浏览器证书详情中核对 SHA-256，与 Clip 桌面端一致</label><p class="hint">证书指纹不一致时，请关闭此页。不要仅凭本页文字判断证书是否可信。</p><button id="connect" class="primary">请求连接</button></form></section><section id="waiting" class="card" hidden><h1>核对连接验证码</h1><div id="code" class="code"></div><p>请在 Clip 的「网页共享」中核对相同验证码，再允许连接。</p></section><section id="workspace" hidden><div class="section-head"><div><h1>共享内容</h1><p id="expiry"></p></div><span id="role" class="badge"></span></div><div class="workspace"><section class="items"><h2>电脑选中的内容 <span id="count">0</span></h2><div id="items"></div></section><section class="preview"><div id="empty">选择一项查看内容</div><div id="detail" hidden><div class="section-head"><h2 id="title"></h2><button id="copy">复制</button></div><pre id="text" tabindex="0"></pre><img id="image" alt="共享图片" hidden><a id="download" download="Clip.png" hidden>另存 PNG 图片</a><button id="select" hidden>选中文字</button></div></section></div><section id="send" class="card" hidden><h2>发送到电脑</h2><p class="hint">内容存入 Clip 历史，由电脑端决定使用；不会自动粘贴或继续转发。</p><form id="send-form"><label>文字<textarea id="message" rows="4" placeholder="输入或粘贴文字"></textarea></label><div class="send-actions"><button class="primary" id="send-text">发送文字</button><label class="file-button">发送图片<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label></div><p class="hint">PNG、JPEG、WebP，最大 16 MiB；发送时转换为 PNG。</p></form></section></section><section id="closed" class="card" hidden><h1>连接已结束</h1><p>请在电脑端生成新邀请后重新打开页面。</p></section><p id="notice" role="status" aria-live="polite"></p></main></body></html>
