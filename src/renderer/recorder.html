<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' clipper-font:; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Clipper · 录屏与录音</title><link rel="stylesheet" href="recorder.css"><link rel="stylesheet" href="one-ui.css"></head><body><header class="media-header"><span id="brand"></span><strong>录屏与录音</strong></header><main class="record-workbench"><p id="message" class="feedback-inline utility-message" role="status" aria-live="polite"></p><section id="setup"><div class="record-heading"><div class="mode segment tabs"><label><input type="radio" name="mode" value="video" checked>录制画面</label><label><input type="radio" name="mode" value="audio">仅录音</label></div><button id="refresh" class="quiet">刷新来源</button></div><div class="recording-layout"><section id="video-settings"><div class="source-tabs segment tabs"><button id="screens" aria-pressed="true">屏幕</button><button id="windows" aria-pressed="false">窗口</button></div><div id="sources" role="group" aria-label="录制来源"></div><div class="region-row"><span id="region-label">录制整个来源</span><button id="choose-region" class="quiet">选定录制区域</button><button id="clear-region" class="quiet" hidden>恢复整屏</button></div></section><aside class="recording-options"><div class="settings-card"><div class="sounds"><label><span>系统声音</span><input id="system-audio" type="checkbox"></label><label><span>麦克风</span><input id="microphone" type="checkbox"></label><select id="microphone-device" aria-label="麦克风设备"><option value="">默认麦克风</option></select></div><div class="fields" id="video-quality"><label>帧率<select id="fps"><option value="15">15 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option></select></label><label>最长边<select id="resolution"><option value="1920">1920 像素</option><option value="2560">2560 像素</option></select></label></div><label class="field">录制格式<select id="record-container"><option value="mp4">MP4 / M4A</option><option value="webm">WebM · VP9 / Opus</option><option value="wav" disabled>WAV · PCM</option></select></label></div></aside></div><div class="bottom"><button id="start" class="primary">开始录制</button></div></section><section id="active" hidden><div class="record-status"><span class="record-dot"></span><strong id="phase-label">正在准备</strong><span id="size">0 MB</span></div><div class="record-focus"><div id="elapsed">00:00</div><div class="meter-row"><span>声音</span><meter id="level" min="0" max="1" value="0" aria-label="当前音量"></meter></div></div><div class="controls"><button id="discard" class="quiet">放弃</button><button id="pause">暂停</button><button id="stop" class="primary">停止并预览</button></div></section><section id="result" hidden><div class="media-result-head"><h1>录制预览</h1><p id="summary"></p><button id="again" class="quiet">新录制</button></div><div class="media-stage"><video id="preview" controls controlslist="nodownload noremoteplayback" disablepictureinpicture disableremoteplayback playsinline preload="metadata"></video></div><div class="bottom"><span id="saved"></span><button id="copy-saved" disabled>复制文件</button><button id="save" class="primary">另存为</button></div></section></main><script src="recorder.js"></script></body></html>
