<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Clipper · 录屏与录音</title><link rel="stylesheet" href="recorder.css"></head><body><header><span id="brand"></span>Clipper<span class="divider"></span><span>录屏与录音</span></header><main><section id="setup"><div class="heading"><div><h1>录屏与录音</h1><p>选择来源，停止后预览并保存到本机</p></div><button id="refresh">刷新来源</button></div><div class="mode"><label><input type="radio" name="mode" value="video" checked>录制画面</label><label><input type="radio" name="mode" value="audio">仅录音</label></div><div id="video-settings"><div class="source-tabs"><button id="screens" aria-pressed="true">屏幕</button><button id="windows" aria-pressed="false">窗口</button></div><div id="sources" role="group" aria-label="录制来源"></div><div class="region-row"><button id="choose-region">选定录制区域</button><span id="region-label">录制整个来源</span><button id="clear-region" class="quiet" hidden>恢复整屏</button></div><div class="fields"><label>帧率<select id="fps"><option value="15">15 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option></select></label><label>最长边<select id="resolution"><option value="1920">1920 像素</option><option value="2560">2560 像素</option></select></label></div></div><div class="sounds"><label><input id="system-audio" type="checkbox">系统声音</label><label><input id="microphone" type="checkbox">麦克风</label><select id="microphone-device" aria-label="麦克风设备"><option value="">默认麦克风</option></select></div><p class="help">系统声音包含此电脑播放的所有声音。录制最长 60 分钟、最多 1 GB，以先达到的限制为准；默认不录制声音。</p><p class="help">录像保存为 MP4，录音保存为 M4A。未保存内容加密暂存，锁定、休眠或退出会清除；导出的媒体文件不受历史加密保护。</p><div class="bottom"><button id="start" class="primary">开始录制</button></div></section><section id="active" hidden><div class="record-status"><span class="record-dot"></span><strong id="phase-label">正在准备</strong><span id="size">0 MB</span></div><div id="elapsed">00:00</div><div class="meter-row"><span>声音</span><meter id="level" min="0" max="1" value="0" aria-label="当前音量"></meter></div><div class="controls"><button id="pause">暂停</button><button id="stop" class="primary">停止并预览</button><button id="discard" class="quiet">放弃</button></div></section><section id="result" hidden><div class="heading"><div><h1>录制预览</h1><p id="summary"></p></div></div><video id="preview" controls controlslist="nodownload noremoteplayback" disablepictureinpicture disableremoteplayback playsinline preload="metadata"></video><p class="help">保存到新文件名，不覆盖已有文件。文件为未加密媒体，不自动加入历史或共享。</p><div class="bottom"><span id="saved"></span><button id="again">新录制</button><button id="copy-saved" disabled>复制文件</button><button id="save" class="primary">另存为</button></div></section><p id="message" role="status" aria-live="polite"></p></main><script src="recorder.js"></script></body></html>
