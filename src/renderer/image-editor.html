<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Clipper · 图片编辑</title><link rel="stylesheet" href="image-editor.css"></head><body><header><span id="brand"></span>Clipper<span class="divider"></span>图片编辑</header><main><div class="heading"><div><h1>编辑图片</h1><p>裁剪、标注与遮盖，保存副本时保留原图</p></div><div class="actions"><button id="undo" title="撤销 Ctrl+Z">撤销</button><button id="redo" title="重做 Ctrl+Y">重做</button></div></div><div class="toolbar" role="toolbar" aria-label="图片工具"><button data-tool="crop" class="active">裁剪</button><button id="rotate">右转 90°</button><button id="flip">水平翻转</button><span class="divider"></span><button data-tool="pen">画笔</button><button data-tool="rect">矩形</button><button data-tool="arrow">箭头</button><button data-tool="text">文字</button><button data-tool="cover">实色遮盖</button></div><div class="options"><label>颜色 <input id="color" type="color" value="#de4747"></label><label>线宽 <input id="width" type="number" min="1" max="80" value="4"></label><label id="text-size-field" hidden>字号 <input id="text-size" type="number" min="8" max="240" value="32"></label><input id="text-value" hidden maxlength="500" placeholder="输入文字，然后点击图片放置" aria-label="标注文字"><button id="apply-crop" disabled>应用裁剪</button><button id="clear-selection" disabled>取消选区</button><span class="spacer"></span><select id="zoom" aria-label="预览缩放"><option value="fit">适应窗口</option><option value="1">100%</option><option value="0.5">50%</option><option value="2">200%</option></select></div><div id="viewport"><div id="surface"><canvas id="image" aria-label="编辑后的图片"></canvas><canvas id="overlay" aria-label="在图片上拖动进行编辑" tabindex="0"></canvas></div></div><div class="status"><span id="dimensions"></span><span id="steps"></span><span id="dirty"></span></div><p class="help" id="hint">拖动选择区域，再应用裁剪。Esc 取消当前选区。</p><footer><p>修改仅保留在内存，锁定或休眠会清除。PNG 导出未加密。</p><div class="actions"><button id="copy">复制图片</button><button id="export">另存 PNG</button><button id="save" class="primary">保存副本</button></div></footer><p id="message" role="status" aria-live="polite"></p></main><script src="image-editor.js"></script></body></html>
