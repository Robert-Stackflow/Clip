<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' clipper-font:; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Clipper · 图片编辑</title><link rel="stylesheet" href="image-editor.css"><link rel="stylesheet" href="one-ui.css"></head><body><header class="media-header"><span id="brand"></span><strong>编辑图片</strong></header><main class="image-workbench"><div class="editor-commandbar"><nav class="toolbar" role="toolbar" aria-label="图片工具"><button data-tool="crop" class="quiet active">裁剪</button><button data-tool="pen" class="quiet">画笔</button><button data-tool="rect" class="quiet">矩形</button><button data-tool="arrow" class="quiet">箭头</button><button data-tool="text" class="quiet">文字</button><button data-tool="cover" class="quiet">实色遮盖</button><span class="divider"></span><button class="quiet" id="rotate">右转 90°</button><button class="quiet" id="flip">水平翻转</button></nav><div class="actions"><button class="quiet" id="undo" title="撤销 Ctrl+Z">撤销</button><button class="quiet" id="redo" title="重做 Ctrl+Y">重做</button></div></div><p id="message" class="feedback-inline utility-message" role="status" aria-live="polite"></p><div class="editor-layout"><section class="editor-stage"><div id="viewport"><div id="surface"><canvas id="image" aria-label="编辑后的图片"></canvas><canvas id="overlay" aria-label="在图片上拖动进行编辑" tabindex="0"></canvas></div></div></section><aside class="editor-tools"><div class="options settings-card"><label>颜色<input id="color" type="color" value="#de4747"></label><label>线宽<input id="width" type="number" min="1" max="80" value="4"></label><label id="text-size-field" hidden>字号<input id="text-size" type="number" min="8" max="240" value="32"></label><div class="crop-actions"><button id="apply-crop" disabled class="primary">应用裁剪</button><button id="clear-selection" disabled class="quiet">取消选区</button></div></div><p id="hint" class="help"></p></aside></div><footer class="editor-footer"><div class="status"><span id="dimensions"></span><span id="steps"></span><span id="dirty"></span><select id="zoom" aria-label="预览缩放"><option value="fit">适应窗口</option><option value="1">100%</option><option value="0.5">50%</option><option value="2">200%</option></select></div><div class="actions"><button id="copy" class="quiet">复制图片</button><button id="export" class="quiet">另存 PNG</button><button id="save" class="primary">保存副本</button></div></footer></main><script src="image-editor.js"></script></body></html>
