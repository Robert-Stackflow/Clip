<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>Clipper · 最近记录</title><link rel="stylesheet" href="tray.css"></head><body><main><header><div><strong>Clipper</strong><span>最近记录</span></div><div class="header-actions"><button id="open-main" title="打开主窗口" aria-label="打开主窗口"></button><button id="close" title="关闭" aria-label="关闭"></button></div></header><div class="search-row"><input id="search" type="search" maxlength="512" placeholder="搜索正文、文件名或来源" aria-label="搜索最近记录" autocomplete="off"><select id="category" aria-label="分类"><option value="">全部分类</option><option value="favorites">收藏</option></select></div><nav id="filters" aria-label="类型筛选"></nav><div class="workspace"><section class="list-pane"><div id="count" aria-live="polite"></div><div id="items" role="listbox" aria-label="最近记录"></div></section><section class="preview-pane" aria-label="内容预览"><div id="preview"><div class="empty">悬停或使用方向键预览</div></div><div class="preview-actions"><button id="copy-selected" disabled>复制</button><button id="paste-selected" disabled>粘贴到原窗口</button></div></section></div><footer><span id="hint">左键复制 · 右键粘贴 · 图片和文件可拖出</span><span id="notice" role="status"></span></footer></main><script src="tray.js"></script></body></html>
