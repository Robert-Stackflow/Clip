<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Clipper · 恢复资料</title><link rel="stylesheet" href="recovery.css"></head>
<body><main><div class="brand">C<span>Clipper</span><small>资料恢复</small></div><div class="intro"><span class="eyebrow">重新连接你的剪贴板</span><h1>暂时无法打开资料</h1><p>可以重试原目录，或从已有资料、备份中恢复。恢复完成前，剪贴板记录保持暂停。</p></div><div class="warning" id="startup-error" role="status"></div><section id="choices"><h2>选择恢复方式</h2><button id="retry" class="option"><b>重试原目录</b><span>连接移动硬盘或修复目录后，继续使用原资料</span><i>↗</i></button><button id="choose-database" class="option"><b>连接已有资料目录</b><span>读取 history.sqlite，检查后创建一份恢复副本</span><i>↗</i></button><button id="choose-backup" class="option"><b>从备份恢复</b><span>支持 Clipper JSON 备份与密码加密备份</span><i>↗</i></button></section><section id="preview" hidden><div class="preview-title"><h2 id="preview-title">校验资料</h2><button id="cancel" class="text">返回选择</button></div><p id="source" class="path"></p><form id="unlock" hidden><label for="password" id="password-label">备份密码</label><div class="input-row"><input id="password" type="password" autocomplete="off" maxlength="1024" placeholder="输入导出备份时设置的密码"></div><label id="source-key-choice" hidden><input id="source-key" type="checkbox">使用资料恢复密钥</label><div id="protection-fields" hidden><label for="new-password">新资料的解锁密码（至少 12 个字符）</label><div class="input-row"><input id="new-password" type="password" autocomplete="new-password" maxlength="1024"></div><label for="repeat-password">再次输入新密码</label><div class="input-row"><input id="repeat-password" type="password" autocomplete="new-password" maxlength="1024"></div><p>恢复的资料也将加密保存；下一步请保存新的恢复密钥。</p></div><div class="input-row"><button type="submit" class="primary">校验并预览</button></div></form><div id="summary" hidden><div id="counts" class="counts"></div><p>将创建独立的恢复副本，保留原文件。恢复后暂停记录和自动备份，方便你先检查内容。</p><p class="path" id="destination"></p><div id="recovery-key-fields" hidden><p>请保存新恢复密钥，再填写确认：</p><pre id="recovery-key"></pre><div class="input-row"><input id="recovery-proof" autocomplete="off" maxlength="64" placeholder="C7-…"></div></div><button id="commit" class="primary">复制恢复并打开</button></div></section><p id="feedback" role="alert"></p><footer><span id="progress">所有恢复操作均在本机完成</span><button id="quit" class="text">退出 Clipper</button></footer></main><script src="recovery.js"></script></body></html>
