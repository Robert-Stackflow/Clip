<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' clipper-font:; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Clipper · 长截图</title><link rel="stylesheet" href="scroll.css"><link rel="stylesheet" href="one-ui.css"></head><body><header class="media-header"><span id="brand"></span><strong>长截图</strong></header><main class="scroll-workbench"><p id="message" class="feedback-inline utility-message" role="status" aria-live="polite"></p><section id="setup"><div class="capture-start settings-card"><h1>长截图</h1><div class="field"><label for="display">显示器</label><select id="display"></select></div><div class="guide"><p>1. 打开目标页面，滚动到需要捕获的起点。</p><p>2. 选区避开固定标题、浮动按钮和滚动条。</p><p>3. 每次向下滚动保留部分重叠，再点击“追加一屏”。</p></div><div class="buttons"><button id="start" class="primary">选择区域并开始</button></div></div></section><section id="capture" hidden><div class="capture-start settings-card"><div class="media-result-head"><h1>正在捕获长截图</h1><button id="discard" class="quiet">放弃本次截图</button></div><p id="progress"></p><div class="buttons"><button id="undo" class="quiet">撤销追加</button><button id="finish">完成预览</button><button id="append" class="primary">追加一屏</button></div></div></section><section id="alignment" hidden><div class="media-result-head"><h1>调整拼接位置</h1><div class="field"><label for="overlap">重叠高度</label><input id="overlap" type="number" min="0" step="1"><span id="overlap-range"></span></div></div><div class="pair"><figure><figcaption>上一屏</figcaption><img id="previous" alt="上一屏画面"></figure><figure><figcaption>当前屏</figcaption><img id="next" alt="待拼接画面"></figure></div><div class="seam-preview"><span class="seam-label">接缝预览</span><canvas id="seam" aria-label="调整后的拼接接缝"></canvas></div><div class="buttons"><button id="reject" class="quiet">放弃当前屏</button><button id="align" class="primary">按此位置拼接</button></div></section><section id="result" hidden><div class="media-result-head"><h1>长截图预览</h1><p id="summary"></p><button id="new" class="quiet">新截图</button></div><div class="preview-scroll"><img id="preview" alt="拼接后的完整长图"></div><div class="buttons"><button id="copy">加入历史并复制</button><button id="save" class="primary">另存为 PNG</button></div></section></main><script src="scroll.js"></script></body></html>
