<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Clipper · 解锁历史</title><link rel="stylesheet" href="unlock.css"></head><body><main><div class="brand">C<span>Clipper</span><small>本地加密</small></div><div class="intro"><span class="eyebrow">你的剪贴板，只在需要时打开</span><h1 id="heading">正在关闭资料…</h1><p id="description">正在停止共享和后台任务。</p></div><form id="unlock-form" hidden><label for="unlock-value" id="value-label">解锁密码</label><div class="input-row"><input id="unlock-value" type="password" autocomplete="off" maxlength="1024" required autofocus></div><div id="new-password-fields" hidden><label for="new-password">设置新密码（至少 12 个字符）</label><div class="input-row"><input id="new-password" type="password" autocomplete="new-password" maxlength="1024"></div><label for="repeat-password">再次输入新密码</label><div class="input-row"><input id="repeat-password" type="password" autocomplete="new-password" maxlength="1024"></div></div><button class="primary" type="submit" id="unlock-submit">解锁历史</button><button class="text" type="button" id="use-recovery">使用恢复密钥</button></form><button class="option" id="hello" hidden><b>使用 Windows Hello</b><span>通过本机身份验证后打开历史</span><i>↗</i></button><p id="feedback" role="alert"></p><p class="field-help">锁定期间不记录剪贴板、不接受共享请求。Windows 剪贴板和已导出的文件仍由你管理。</p><footer><button id="recover" class="text" disabled>从资料或备份恢复</button><button id="quit" class="text">退出 Clipper</button></footer></main><script src="unlock.js"></script></body></html>
