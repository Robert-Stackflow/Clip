<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' clip-font:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>Clip · AI 对话</title><link rel="stylesheet" href="chat.css"></head><body data-loading="true"><main class="chat-shell"><header class="chat-header"><div id="chat-sidebar-control" class="window-controls"></div><div id="chat-header-actions" class="window-controls"></div></header><div class="chat-body"><aside id="chat-history" hidden><div class="chat-history-heading"><strong>历史对话</strong></div><input id="history-search" type="search" placeholder="搜索对话" aria-label="搜索对话"><div id="history-items"></div></aside><div class="chat-conversation"><div class="chat-workspace"><section id="chat-messages" aria-label="对话消息" aria-busy="true"><div class="chat-initial-loading" role="status"><span class="chat-working" aria-hidden="true"><i></i><i></i><i></i></span><span>正在加载对话…</span></div></section><button id="chat-scroll-bottom" class="icon-button quiet" aria-label="回到最新消息" hidden></button></div><section class="chat-input-area"><div id="chat-status" role="status" hidden></div><div class="chat-composer" id="chat-composer"><div id="chat-attachments" hidden></div><textarea disabled id="chat-input" rows="2" placeholder="输入消息" aria-label="消息" spellcheck="false"></textarea><div class="chat-composer-toolbar"><div class="chat-input-tools" id="chat-input-tools"></div><div class="chat-service"><button id="chat-profile-trigger" type="button" class="custom-select" aria-label="选择模型" aria-haspopup="dialog" aria-expanded="false"><span>正在加载</span></button></div><label class="chat-reasoning" hidden><select id="chat-reasoning" aria-label="推理强度" title="推理强度"></select></label><span class="chat-toolbar-spacer">
