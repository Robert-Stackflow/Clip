[package]
name = "clipper-document-info"
version = "0.27.0"
edition = "2024"
license = "MIT"

[dependencies]
lopdf = { version = "=0.45.0", default-features = false }
msoffice-crypto = { version = "=0.1.0-rc.4", features = ["legacy-binary"] }
cfb = "=0.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
encoding_rs = "0.8"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
panic = "abort"
